{% extends 'base.html' %}

{% block titulo %}Mensagem Enviada — Devocional e Discipulado{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 text-center py-5">
        <div class="mb-4">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;" aria-hidden="true"></i>
        </div>
        <h1 class="h3 fw-bold mb-2">Mensagem enviada!</h1>
        <p class="text-muted mb-4">
            Recebemos seu contato e nossa equipe responderá em breve.
        </p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
            <a href="{% url 'sac:formulario' %}" class="btn btn-outline-primary">
                <i class="bi bi-envelope-plus me-1" aria-hidden="true"></i>Enviar outra mensagem
            </a>
            <a href="{% url 'core:home' %}" class="btn btn-primary">
                <i class="bi bi-house me-1" aria-hidden="true"></i>Ir para o início
            </a>
        </div>
    </div>
</div>
{% endblock %}
