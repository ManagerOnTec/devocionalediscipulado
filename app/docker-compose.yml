# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Ambiente de desenvolvimento local
#
# Serviços:
#   db  → PostgreSQL 16
#   web → Django (runserver)
#
# Uso:
#   make up       → sobe os containers
#   make down     → para os containers
#   make logs     → exibe logs
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Banco de dados PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: devocional_db
    restart: unless-stopped
    volumes:
      # Persiste os dados entre reinicializações
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME:-devocionalediscipulado}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Expõe porta para acesso direto com DBeaver/pgAdmin
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-devocionalediscipulado}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Aplicação Django ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Usa o stage builder que tem ferramentas de dev
      target: builder
    container_name: devocional_web
    restart: unless-stopped
    # Sobrescreve o entrypoint de produção: usa runserver para hot-reload
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Monta o código local para hot-reload
      - .:/app
      # Volumes isolados para estáticos e mídia
      - staticfiles_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    # Carrega todas as variáveis do .env local
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

# ── Volumes persistentes ───────────────────────────────────────────────────────
volumes:
  postgres_data:
  staticfiles_volume:
  media_volume:
