# ─────────────────────────────────────────────────────────────────────────────
# Configuração Nginx — proxy reverso para desenvolvimento local com Docker
#
# Em produção (Cloud Run), o Nginx não é usado:
# o WhiteNoise serve os estáticos diretamente via Gunicorn.
# ─────────────────────────────────────────────────────────────────────────────

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Tamanho máximo de upload (ajustar conforme necessidade)
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Arquivos estáticos servidos diretamente pelo Nginx (sem passar pelo Django)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Arquivos de mídia (uploads dos usuários)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Tudo o mais vai para o Django / Gunicorn
    location / {
        proxy_pass         http://django;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
