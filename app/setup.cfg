# ─────────────────────────────────────────────────────────────────────────────
# setup.cfg — Configuração de ferramentas de desenvolvimento
# ─────────────────────────────────────────────────────────────────────────────

[tool:pytest]
# Usa as settings de desenvolvimento para rodar os testes
DJANGO_SETTINGS_MODULE = config.settings.dev
# Descobre testes em apps/ e tests/
python_files = tests/*.py apps/*/tests/*.py apps/*/tests/**/*.py
# Flags padrão: verboso, traceback curto, reutiliza banco entre runs
addopts = -v --tb=short --reuse-db
# Marca os testes que requerem banco de dados
markers =
    slow: testes lentos (deselect com -m "not slow")

[flake8]
# Compatível com o Black (88 chars)
max-line-length = 88
extend-ignore =
    # E203: espaço antes de ':' (Black formata assim)
    E203,
    # W503: quebra de linha antes de operador binário
    W503,
    # E501: linha muito longa (já controlado pelo max-line-length)
    E501
exclude =
    .git,
    __pycache__,
    */migrations/*,
    venv,
    .venv,
    staticfiles,
    media

[isort]
# Compatível com o Black
profile = black
known_django = django
known_first_party = apps,config
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
skip = migrations,venv,.venv
