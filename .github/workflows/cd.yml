# ─────────────────────────────────────────────────────────────────────────────
# cd.yml — Deploy Contínuo
#
# Executa SOMENTE após ci.yml concluir com sucesso em push para main.
# Jobs:
#   build-and-push    → build Docker e push para DockerHub
#   deploy-cloud-run  → deploy no Google Cloud Run
#
# Secrets obrigatórios (Repository Settings → Secrets):
#   DOCKERHUB_USERNAME  → usuário DockerHub
#   DOCKERHUB_TOKEN     → access token DockerHub
#   DOCKERHUB_IMAGE     → ex: myuser/devocionalediscipulado
#   GCP_SA_KEY          → JSON da service account GCP (base64 ou JSON puro)
#   CLOUD_RUN_SERVICE   → nome do serviço Cloud Run
#   CLOUD_RUN_REGION    → ex: southamerica-east1
# ─────────────────────────────────────────────────────────────────────────────

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # ── Build e Push para DockerHub ─────────────────────────────────────────────
  build-and-push:
    name: Build Docker + Push DockerHub
    runs-on: ubuntu-latest
    # Só executa se o CI passou com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      image_sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Expor SHA do commit
        id: meta
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: app/
          file: app/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          build-args: |
            SECRET_KEY=django-insecure-build-only

  # ── Deploy no Cloud Run ─────────────────────────────────────────────────────
  deploy-cloud-run:
    name: Deploy Google Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy ${{ secrets.CLOUD_RUN_SERVICE }} \
            --image ${{ secrets.DOCKERHUB_IMAGE }}:${{ github.event.workflow_run.head_sha }} \
            --platform managed \
            --region ${{ secrets.CLOUD_RUN_REGION }} \
            --allow-unauthenticated \
            --set-env-vars "DJANGO_SETTINGS_MODULE=config.settings.prod" \
            --set-secrets "SECRET_KEY=django-secret-key:latest,DATABASE_URL=django-db-url:latest"
