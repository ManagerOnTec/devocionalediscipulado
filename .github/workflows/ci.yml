# ─────────────────────────────────────────────────────────────────────────────
# ci.yml — Integração Contínua
#
# Executa em todo push e pull_request para main e develop.
# Jobs:
#   test → roda pytest + coverage com PostgreSQL real
#   lint → flake8 / black / isort
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Testes ──────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python 3.12 + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=10s

    env:
      SECRET_KEY: django-insecure-ci-test-key
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      ALLOWED_HOSTS: localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('app/requirements/base.txt', 'app/requirements/dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: app/
        run: pip install -r requirements/dev.txt

      - name: Copy .env
        working-directory: app/
        run: cp .env.example .env

      - name: Django system check
        working-directory: app/
        run: python manage.py check --settings=config.settings.dev

      - name: Run tests with coverage
        working-directory: app/
        run: pytest --cov=apps --cov-report=xml -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: app/coverage.xml
          fail_ci_if_error: false

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8 / black / isort)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install flake8 black isort

      - name: flake8
        working-directory: app/
        run: flake8 apps/ --max-line-length=120 --exclude=migrations

      - name: black (aviso apenas)
        working-directory: app/
        run: black --check apps/
        continue-on-error: true

      - name: isort (aviso apenas)
        working-directory: app/
        run: isort --check-only apps/
        continue-on-error: true
